  width: 100%;
  max-width: 26rem;
  margin: 0;
}
.portrait-frame > img {
  aspect-ratio: 4/5;
  -o-object-fit: cover;
  object-fit: cover;
  border-radius: 6px;
  width: 100%;
}
.home-portrait > img {
  -o-object-position: 50% 8%;
  object-position: 50% 8%;
}
.about-portrait > img {
  -o-object-position: 50% 35%;
  object-position: 50% 35%;
}
.about-opening {
  grid-template-columns: 1.1fr 0.9fr;
  gap: 5rem;
}
.about-opening .lead {
  max-width: 33rem;
}
.about-portrait {
  max-width: 24rem;
}
.contemplation-frame {
  max-width: 25rem;
  margin-top: 2rem;
}
.contemplation-frame > img {
  border-radius: 6px;
  width: 100%;
  height: auto;
}
.cafe-frame > img {
  -o-object-position: 50% 45%;
  object-position: 50% 45%;
}
.about-approach .cafe-frame {
  max-width: 25rem;
}
@media (width<=960px) {
  .about-opening {
    gap: 3rem;
  }
  .portrait-frame {
    max-width: 24rem;
  }
  .hero-personal > img {
    -o-object-position: 64% 45%;
    object-position: 64% 45%;
  }
}
@media (width<=700px) {
  .hero-personal {
    aspect-ratio: 4/3;
    height: auto;
  }
  .hero-personal > img {
    -o-object-position: 62% 45%;
    object-position: 62% 45%;
  }
  .about-opening {
    grid-template-columns: 1fr;
    gap: 2rem;
  }
  .portrait-frame,
  .about-portrait {
    width: 100%;
    max-width: 25rem;
  }
  .contemplation-frame {
    max-width: 22rem;
  }
  .about-approach .cafe-frame {
    order: 2;
  }
  .home-portrait {
    margin-top: 0.5rem;
  }
}
@media print {
  .site-header,
  .site-footer,
  .enquiry,
  .hero-photo,
  .menu-button {
    display: none;
  }
  .section,
  .page-intro {
    padding-block: 1.5rem;
  }
  .container {
    width: 100%;
  }
  .session-body {
    display: block;
  }
  .sticky-aside {
    position: static;
  }
  body {
    font-size: 12pt;
  }
  .split {
    gap: 2rem;
  }
  h1 {
    font-size: 36pt;
  }
  h2 {
    font-size: 26pt;
  }
}
.pw {
  --paper: #fcfcfd;
  --ink: #192943;
  --muted: #536278;
  --line: #dce3e6;

.pw * {

}

}
.pw img {

                <p class="eyebrow">The approach</p>
                <h2>Why Speak First?</h2>
                <figure class="speak-portraits"><img alt="Rebecca in a tiger T-shirt with a cup of coffee at an outdoor café." width="1122" height="1402" loading="lazy" decoding="async" data-embedded-src="assets/photos/rebecca-cafe-edited.webp"><img alt="Rebecca seated beside the water with her hands together in contemplation." width="1152" height="1536" loading="lazy" data-embedded-src="assets/photos/rebecca-contemplating.webp"></figure>
              </div>
              <div class="prose">
                <p>Speak First is our way to begin with conversation. I ask questions, listen and help you explore your experience before we shape it into writing.</p>
                <p>By using <strong>embodied voice</strong> (speaking with attention to your body as well as your thoughts) noticing your breath, allowing pauses, and recognising when a phrase feels natural, strained or incomplete, there is room to slow down, change your mind and find another way to say something.</p>
                <p>I use this approach because a conversation can give us
                  concrete examples, familiar expressions and details that are
                  difficult to reach when trying to write a polished
                  introduction. You can explain what actually happens in your
                  work, hear your own words and notice what matters to you.</p>
                <p>Speaking first can ease the pressure of the blank page. It
                  also gives us source material in your own language, which we
                  can return to as the writing develops.</p>
                <p>With your agreement, the sessions are recorded and
                  transcribed. I use AI tools to help organise the material into
                  notes and drafts, which I review. We agree how your recordings
                  will be used before beginning, and you decide what is suitable
                  to share publicly.</p>
              </div>
            </div></section>

</script><script>// Small enhancements shared by the six static pages and the portable preview.
(() => {
  function setMenu(button, open) {
    const navigation = document.getElementById(
      button.getAttribute("aria-controls"),
    );
    navigation.classList.toggle("is-open", open);
    button.setAttribute("aria-expanded", String(open));
    button.setAttribute(
      "aria-label",
      open ? "Close navigation" : "Open navigation",
    );
    button.firstChild.textContent = open ? "Close " : "Menu ";
    button.querySelector("span").textContent = open ? "×" : "☰";
  }

  function setAccordion(button, open) {
    const panel = document.getElementById(button.getAttribute("aria-controls"));
    const heading = button.closest("h3");
    const state = open ? "open" : "closed";
    button.setAttribute("aria-expanded", String(open));
    for (const part of [button, heading, heading.parentElement, panel]) {
      part.dataset.state = state;
    }
    panel.hidden = !open;
  }

  function selectTab(selected) {
    const group = selected.closest('[role="tablist"]');
    for (const tab of group.querySelectorAll('[role="tab"]')) {
      const active = tab === selected;
      tab.tabIndex = active ? 0 : -1;
      tab.setAttribute("aria-selected", String(active));
      document.getElementById(tab.getAttribute("aria-controls")).hidden =
        !active;
    }
  }

  document.addEventListener("click", (event) => {
    const button = event.target.closest("button");
    if (button?.matches(".menu-button")) {
      setMenu(button, button.getAttribute("aria-expanded") !== "true");
    } else if (button?.matches(".accordion-trigger")) {
      setAccordion(button, button.getAttribute("aria-expanded") !== "true");
    } else if (button?.matches("[data-cycle]")) {
      selectTab(button);
    } else if (event.target.closest("#main-nav a")) {
      const menu = document.querySelector(".menu-button");
      if (menu?.getAttribute("aria-expanded") === "true") setMenu(menu, false);
    }
  });

  document.addEventListener("keydown", (event) => {
    const menu = document.querySelector('.menu-button[aria-expanded="true"]');
    if (event.key === "Escape" && menu) {
      setMenu(menu, false);
      menu.focus();
      return;
    }

    const current = event.target.closest("[data-cycle], .accordion-trigger");
    if (!current) return;
    const isTab = current.matches("[data-cycle]");
    const group = current.closest(
      isTab ? '[role="tablist"]' : ".sessions, .faq-list",
    );
    const controls = Array.from(
      group.querySelectorAll(isTab ? "[data-cycle]" : ".accordion-trigger"),
    );
    const index = controls.indexOf(current);
    const nextKey = isTab ? "ArrowRight" : "ArrowDown";
    const previousKey = isTab ? "ArrowLeft" : "ArrowUp";
    const positions = {
      [nextKey]: (index + 1) % controls.length,
      [previousKey]: (index + controls.length - 1) % controls.length,
      Home: 0,
      End: controls.length - 1,
    };
    if (!Object.hasOwn(positions, event.key)) return;
    event.preventDefault();
    const next = controls[positions[event.key]];
    if (isTab) selectTab(next);
    next.focus();
  });
})();
</script><script>// Hash routes let all six pages share one attachment, with normal Back and Forward navigation.
(() => {
  const assets = JSON.parse(document.getElementById("embedded-assets").textContent);
  const pages = new Map(Array.from(document.querySelectorAll("template[data-page]"), template => [template.dataset.page, template]));
  const root = document.getElementById("preview");
  let current = null;

  function navigate() {
    const [requested, anchor] = location.hash.slice(1).split("#");
    const page = pages.get(requested || "/") || pages.get("/");
    if (page !== current) {
      const content = page.content.cloneNode(true);
      for (const image of content.querySelectorAll("[data-embedded-src]")) {
        image.src = assets[image.dataset.embeddedSrc];
        image.removeAttribute("data-embedded-src");
      }
      for (const link of content.querySelectorAll("[data-embedded-href]")) {
        link.href = assets[link.dataset.embeddedHref];
      }
      root.replaceChildren(content);
      document.title = page.dataset.title;
      const main = document.getElementById("main");
      main.tabIndex = -1;
      if (current) main.focus({preventScroll: true});
      current = page;
    }
    if (anchor) {
      const element = document.getElementById(anchor);
      element?.scrollIntoView();
      if (element?.id === "main") element.focus({preventScroll: true});
    } else {
      window.scrollTo({top: 0, behavior: "instant"});
    }
  }

  // Open the example image in the current file as well. Top-level data URLs
  // are restricted in some browsers, including when viewing an attachment.
  document.addEventListener("click", event => {
    if (event.defaultPrevented || event.metaKey || event.ctrlKey || event.shiftKey || event.altKey) return;
    const link = event.target.closest("a");
    if (!link) return;
    if (!link.hasAttribute("data-embedded-href")) {
      if (link.getAttribute("href")?.startsWith("#/") && link.hash === location.hash) {
        event.preventDefault();
        navigate();
      }
      return;
    }
    event.preventDefault();
    const dialog = document.getElementById("image-viewer");
    dialog.querySelector("img").src = assets[link.dataset.embeddedHref];
    dialog.querySelector("img").alt = link.querySelector("img")?.alt || "Pearlsites website example";
    dialog.showModal();
  });
  document.getElementById("image-viewer").addEventListener("click", event => {
    if (event.target.tagName === "DIALOG") event.target.close();
  });
  window.addEventListener("hashchange", navigate);
  navigate();
})();
